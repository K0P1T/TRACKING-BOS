<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelacak Perangkat</title>
</head>
<body>
    <h1>Pelacak Perangkat</h1>
    <form id="trackForm">
        <label for="phoneNumber">Nomor Telepon:</label>
        <input type="text" id="phoneNumber" placeholder="Masukkan nomor telepon" required>
        <button type="submit">Lacak Lokasi</button>
    </form>

    <script>
        document.getElementById('trackForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah pengiriman form

            const phoneNumber = document.getElementById('phoneNumber').value;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => kirimLokasiKeServer(position, phoneNumber),
                    (error) => tampilkanError(error)
                );
            } else {
                alert("Geolocation tidak didukung oleh browser ini.");
            }
        });

        function kirimLokasiKeServer(position, phoneNumber) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            fetch('http://localhost:3000/track', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ phoneNumber, latitude, longitude }),
            })
            .then(response => response.json())
            .then(data => {
                console.log('Sukses:', data);
                alert('Lokasi berhasil dilacak!');
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Gagal melacak lokasi.');
            });
        }

        function tampilkanError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    alert("Pengguna menolak permintaan geolokasi.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Informasi lokasi tidak tersedia.");
                    break;
                case error.TIMEOUT:
                    alert("Permintaan lokasi melebihi batas waktu.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("Terjadi kesalahan tidak diketahui.");
                    break;
            }
        }
    </script>
</body>
</html>
